---
version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      cargo:
        update-types: [minor, patch]

  # The root module has no dependencies. Only conformance/ pulls in go-jsonnet.
  - package-ecosystem: gomod
    directory: /conformance
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      gomod:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        update-types: [minor, patch]
