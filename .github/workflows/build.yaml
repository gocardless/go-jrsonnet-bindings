---
name: Build

"on":
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Release version (used in filenames and as the release tag,
          e.g. "1.2.3" produces tag "v1.2.3").
        type: string
        required: true

jobs:
  libjrsonnet_go:
    name: Build libjrsonnet_go.a (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    # Every target is built natively (runner arch + container libc match the
    # target triple), so no cross-toolchains are required. musl targets build
    # inside Alpine, where the system gcc is musl-gcc.
    container: ${{ matrix.container }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            container: rust:alpine
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            container: rust:alpine

    steps:
      - uses: actions/checkout@v4

      # Alpine images ship Rust already; add the C toolchain psm/stacker's build
      # scripts need (gcc = musl-gcc here) plus git for cargo's git dependencies.
      - if: matrix.container
        run: apk add --no-cache gcc musl-dev git

      - if: ${{ !matrix.container }}
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - run: cargo build --release --lib --target ${{ matrix.target }}

      - name: Stage artifact
        run: |
          mkdir -p lib/${{ matrix.target }}
          cp -v target/${{ matrix.target }}/release/libjrsonnet_go.a \
                lib/${{ matrix.target }}/libjrsonnet_go.a

      - uses: actions/upload-artifact@v4
        with:
          name: libjrsonnet_go-${{ matrix.target }}
          path: lib/${{ matrix.target }}/libjrsonnet_go.a

  release:
    name: Release
    if: github.event_name == 'workflow_dispatch'
    needs: libjrsonnet_go
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Normalize and validate version
        env:
          RAW_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${RAW_VERSION#v}" # tolerate a typed leading v
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].+)?$ ]]; then
            echo "::error::invalid version '${RAW_VERSION}' (want e.g. 1.2.3)"
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Assemble release tarball
        run: |
          mkdir -p out
          for dir in dist/libjrsonnet_go-*; do
            target="${dir#dist/libjrsonnet_go-}"
            staged="stage/${target}/lib/${target}"
            mkdir -p "${staged}"
            cp -v "${dir}/libjrsonnet_go.a" "${staged}/"
            tar -czvf "out/libjrsonnet_go-${VERSION}-${target}.tar.gz" \
                -C "stage/${target}" lib
          done
          ( cd out && sha256sum *.tar.gz > SHA256SUMS )

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          files: |
            out/libjrsonnet_go-*-*.tar.gz
            out/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
