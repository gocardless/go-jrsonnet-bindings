---
name: Build

"on":
  push:
    branches: [master]
    tags: [v*]
  pull_request:
  workflow_dispatch:

jobs:
  libjrsonnet_go:
    name: Build libjrsonnet_go.a (${{ matrix.target }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            apt: gcc-aarch64-linux-gnu
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - if: matrix.apt
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - run: cargo build --release --lib --target ${{ matrix.target }}

      - name: Stage artifact
        run: |
          mkdir -p lib/${{ matrix.target }}
          cp -v target/${{ matrix.target }}/release/libjrsonnet_go.a \
                lib/${{ matrix.target }}/libjrsonnet_go.a

      - uses: actions/upload-artifact@v4
        with:
          name: libjrsonnet_go-${{ matrix.target }}
          path: lib/${{ matrix.target }}/libjrsonnet_go.a

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: libjrsonnet_go
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Assemble release tarball + checksums
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${REF_NAME#v}"
          mkdir -p out
          for dir in dist/libjrsonnet_go-*; do
            target="${dir#dist/libjrsonnet_go-}"
            staged="stage/${target}/lib/${target}"
            mkdir -p "$staged"
            cp -v "${dir}/libjrsonnet_go.a" "$staged/"
            tar -czvf "out/libjrsonnet_go-${VERSION}-${target}.tar.gz" \
                -C "stage/${target}" lib
          done
          ( cd out && sha256sum *.tar.gz > SHA256SUMS )

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/libjrsonnet_go-*-*.tar.gz
            out/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
