# Configuration for cargo-about. CI uses it to generate THIRD_PARTY_LICENSES
# for the Rust crates bundled into libjrsonnet_go.a (see build.yaml).
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

# Only the targets we publish release tarballs for (see build.yaml).
targets = [
    "aarch64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "aarch64-unknown-linux-musl",
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
]

# Leave our own crate out; it is covered by LICENSE.
ignore-build-dependencies = true
ignore-dev-dependencies = true
private = { ignore = true }
