language = "C"
include_guard = "JRSONNET_GO_H"
no_includes = true
sys_includes = ["stdarg.h", "stdbool.h", "stddef.h", "stdint.h", "stdlib.h"]

[export]
include = [
    "VM",
    "GoResult",
    "GoImportCallback",
    "GoNativeCallback",
]
# GoStr has the layout of cgo's _GoString_, which cgo defines in every
# preamble. cbindgen then warns that it can't find GoStr; that's expected.
exclude = ["GoStr"]

[export.rename]
"GoResult" = "GoResult"
"GoStr" = "_GoString_"

[fn]
prefix = ""
